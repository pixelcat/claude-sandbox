---
# Convert PKCS12/JKS keystores to BCFKS.
#
# Conversion always writes a new file and never removes the source, so a bad
# conversion is recoverable by pointing the config back at the original.
# Passwords are passed through the environment rather than argv, where `ps`
# would expose them to every local user for the life of the keytool process.

- name: Locate the provider jars for keytool
  ansible.builtin.find:
    paths: "{{ fips_provider_dir_opensearch }}"
    patterns: "bc*-fips-*.jar"
  register: fips_keytool_jars

- name: Assert provider jars were found for keytool
  ansible.builtin.assert:
    that:
      - fips_keytool_jars.files | length > 0
    fail_msg: >-
      No bc*-fips jars found in {{ fips_provider_dir_opensearch }}. keytool
      cannot write a BCFKS store without the provider on its classpath.

- name: Build the keytool provider classpath
  ansible.builtin.set_fact:
    fips_keytool_classpath: "{{ fips_keytool_jars.files | map(attribute='path') | join(':') }}"

- name: Check which BCFKS keystores already exist
  ansible.builtin.stat:
    path: "{{ item.dest }}"
  loop: "{{ fips_keystores }}"
  loop_control:
    label: "{{ item.dest }}"
  register: fips_keystore_stat

- name: Convert keystores to BCFKS
  ansible.builtin.command:
    argv:
      - keytool
      - -importkeystore
      - -noprompt
      - -srckeystore
      - "{{ item.item.src }}"
      - -srcstoretype
      - "{{ item.item.src_type | default('PKCS12') }}"
      - -destkeystore
      - "{{ item.item.dest }}"
      - -deststoretype
      - BCFKS
      - -providerclass
      - org.bouncycastle.jcajce.provider.BouncyCastleFipsProvider
      - -providerpath
      - "{{ fips_keytool_classpath }}"
      - -srcstorepass:env
      - SRC_STOREPASS
      - -deststorepass:env
      - DEST_STOREPASS
  environment:
    SRC_STOREPASS: "{{ vars[item.item.password_var] }}"
    DEST_STOREPASS: "{{ vars[item.item.dest_password_var | default(item.item.password_var)] }}"
  loop: "{{ fips_keystore_stat.results }}"
  loop_control:
    label: "{{ item.item.src }} -> {{ item.item.dest }}"
  when: not item.stat.exists
  no_log: true
  notify:
    - Restart opensearch
    - Restart logstash

- name: Secure the converted keystores
  ansible.builtin.file:
    path: "{{ item.dest }}"
    owner: "{{ fips_keystore_owner }}"
    group: "{{ fips_keystore_group }}"
    mode: "{{ fips_keystore_mode }}"
  loop: "{{ fips_keystores }}"
  loop_control:
    label: "{{ item.dest }}"

# A store that keytool wrote but cannot read back is worse than no store: the
# service will fail at startup with a less obvious error.
- name: Verify each converted keystore is readable as BCFKS
  ansible.builtin.command:
    argv:
      - keytool
      - -list
      - -keystore
      - "{{ item.dest }}"
      - -storetype
      - BCFKS
      - -providerclass
      - org.bouncycastle.jcajce.provider.BouncyCastleFipsProvider
      - -providerpath
      - "{{ fips_keytool_classpath }}"
      - -storepass:env
      - STOREPASS
  environment:
    STOREPASS: "{{ vars[item.dest_password_var | default(item.password_var)] }}"
  loop: "{{ fips_keystores }}"
  loop_control:
    label: "{{ item.dest }}"
  register: fips_keystore_check
  changed_when: false
  failed_when: fips_keystore_check.rc != 0
  no_log: true
