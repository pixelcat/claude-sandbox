# TEMPLATE ONLY — do NOT commit real credentials.
#
# SSH credentials for the cert-sync job. This user is SEPARATE from the
# read-only mktxp monitoring user and is PRIVILEGED: it can write certs and
# change /ip service. Treat it accordingly.
#
# On each router create a dedicated group + user (RouterOS):
#   /user group add name=mktxp-certsync \
#     policy=ssh,ftp,read,write,policy,sensitive,test \
#     comment="cert-sync: install api-ssl certificate"
#   /user add name=certsync group=mktxp-certsync password=<STRONG> \
#     address=<K8S_EGRESS_CIDR> comment="LE cert push (cert-sync job)"
#
# Prefer SSH key auth over password: put the PRIVATE key in `ssh-privatekey`
# below and add the PUBLIC key on each router with:
#   /user ssh-keys import user=certsync public-key-file=certsync.pub
#
# Apply out-of-band; do not commit. Scope the user to the egress CIDR and,
# if you would rather not hold a write credential in-cluster, run the sync
# manually instead (see README "Manual cert install").
apiVersion: v1
kind: Secret
metadata:
  name: mktxp-certsync-ssh
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: mikrotik-monitoring
type: Opaque
stringData:
  username: certsync
  # Use EITHER password OR ssh-privatekey (key preferred). Leave the unused
  # one empty.
  password: REPLACE_OR_LEAVE_EMPTY
  ssh-privatekey: |
    REPLACE_WITH_PRIVATE_KEY_OR_LEAVE_EMPTY
