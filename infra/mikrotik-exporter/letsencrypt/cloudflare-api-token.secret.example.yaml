# TEMPLATE ONLY — do NOT commit the real token.
#
# Cloudflare API token for the cert-manager DNS-01 solver. Create it in the
# Cloudflare dashboard with the MINIMUM scope:
#   - Zone : DNS  : Edit    (on the dployr.com zone only)
#   - Zone : Zone : Read    (on the dployr.com zone only)
# Do NOT use a Global API Key — it grants full-account access.
#
# Apply out-of-band (kubectl create secret / ESO / SOPS), don't commit:
#   kubectl -n cert-manager create secret generic cloudflare-api-token \
#     --from-literal=api-token='<TOKEN>'
#
# NOTE: the Secret must live in the namespace where cert-manager runs
# (commonly `cert-manager`), because the ClusterIssuer's solver reads it
# from cert-manager's own namespace.
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
  labels:
    app.kubernetes.io/part-of: mikrotik-monitoring
type: Opaque
stringData:
  api-token: REPLACE_WITH_CLOUDFLARE_API_TOKEN
