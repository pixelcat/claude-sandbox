# Let's Encrypt issuer using the Cloudflare DNS-01 challenge. DNS-01 is the
# only LE challenge that works for *.internal.dployr.com, since those hosts
# are not publicly reachable on port 80 (HTTP-01 / RouterOS's built-in ACME
# would fail). DNS-01 proves control of the dployr.com zone instead.
#
# Start with the STAGING server first to avoid LE rate limits while testing
# (swap the two `server`/`name` blocks), then move to production.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-dns01
  labels:
    app.kubernetes.io/part-of: mikrotik-monitoring
spec:
  acme:
    # Production. For testing use:
    #   https://acme-staging-v02.api.letsencrypt.org/directory
    server: https://acme-v02.api.letsencrypt.org/directory
    email: REPLACE_WITH_OPS_EMAIL      # LE expiry notices go here
    privateKeySecretRef:
      name: letsencrypt-dns01-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
        selector:
          dnsZones:
            - dployr.com
