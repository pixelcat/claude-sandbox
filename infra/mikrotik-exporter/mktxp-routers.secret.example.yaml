# TEMPLATE ONLY — do NOT commit real passwords.
#
# This file carries the mktxp router entries (mktxp.conf). It is a Secret,
# not a ConfigMap, because each [entry] contains a router password.
#
# Usage (pick one):
#   1. Copy to mktxp-routers.secret.yaml, fill in the three passwords, and
#      apply it WITHOUT committing it (it is gitignored). Or
#   2. Better: create it imperatively from a file you keep in your secret
#      manager, so the plaintext never touches a file kustomize tracks:
#
#        kubectl -n monitoring create secret generic mktxp-routers \
#          --from-file=mktxp.conf=/path/to/your/mktxp.conf
#
#   3. Best: manage it through External Secrets Operator / Vault / SOPS so
#      Kubernetes never stores it at rest unencrypted. See README.
#
# The three routers each use a UNIQUE password (per threat-model guidance:
# one leaked exporter secret should not equally expose all three routers).
apiVersion: v1
kind: Secret
metadata:
  name: mktxp-routers
  namespace: monitoring
  labels:
    app.kubernetes.io/name: mktxp
    app.kubernetes.io/component: exporter
type: Opaque
stringData:
  mktxp.conf: |
    [doohickey]
        hostname = doohickey.internal.dployr.com
        port = 8729
        username = mktxp
        password = REPLACE_WITH_DOOHICKEY_PASSWORD
        # Encrypted API (api-ssl). The router presents a Let's Encrypt cert
        # (issued by cert-manager, pushed by the cert-sync job), so we verify
        # it against the LE chain and check the hostname matches.
        use_ssl = True
        ssl_certificate_verify = True
        ssl_check_hostname = True
        ssl_ca_file = /etc/mktxp-ca/le-chain.pem
        # RouterOS 6.43+ / v7 use plaintext login over the TLS channel.
        plaintext_login = True
        enabled = True

    [gizmo]
        hostname = gizmo.internal.dployr.com
        port = 8729
        username = mktxp
        password = REPLACE_WITH_GIZMO_PASSWORD
        use_ssl = True
        ssl_certificate_verify = True
        ssl_check_hostname = True
        ssl_ca_file = /etc/mktxp-ca/le-chain.pem
        plaintext_login = True
        enabled = True

    [gadget]
        hostname = gadget.internal.dployr.com
        port = 8729
        username = mktxp
        password = REPLACE_WITH_GADGET_PASSWORD
        use_ssl = True
        ssl_certificate_verify = True
        ssl_check_hostname = True
        ssl_ca_file = /etc/mktxp-ca/le-chain.pem
        plaintext_login = True
        enabled = True
